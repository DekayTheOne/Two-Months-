const $=id=>document.getElementById(id);

const save=()=>{try{localStorage.setItem('melanie100',JSON.stringify(got))}catch(e){}};
const cv=$('c'),x=cv.getContext('2d');
let W,H,D,S,stars=[],arrows=[],gifts=[],parts=[],shoots=[],aim=null,t=0,last=0,nextGift=0,lastShot=0;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);S=Math.min(W,H*1.2)/700;S=Math.max(.6,Math.min(S,1.3));stars=Array.from({length:Math.round(W*H/3200)},()=>({x:Math.random()*W,y:Math.random()*H*.8,r:Math.random()*1.4+.3,p:Math.random()*6.3,s:Math.random()*2+1}))}
addEventListener('resize',rs);rs();
const bow=()=>({x:W/2,y:H-70*S-env()});function env(){return 0}

function spawn(){const l=Math.random()<.5;gifts.push({x:l?-40:W+40,y0:H*(.14+Math.random()*.4),vx:(l?1:-1)*(45+Math.random()*50)*S,ph:Math.random()*6,r:24*S,c:['#ff7a8a','#ffb36b','#ff9ecb','#ffd27a'][Math.random()*4|0],y:0})}

let tm;function show(i){$('cn').textContent='RAZÓN Nº '+(i+1)+' DE 100'+(got.length===100?' · ¡ÁLBUM COMPLETO!':'');$('ct').textContent=P[i];$('card').classList.add('on');clearTimeout(tm);tm=setTimeout(()=>$('card').classList.remove('on'),9000)}

function sky(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d0620');g.addColorStop(.55,'#2d1245');g.addColorStop(.85,'#7a2e56');g.addColorStop(1,'#d9667a');x.fillStyle=g;x.fillRect(0,0,W,H);
for(let i=0,n=stars.length*(.55+.45*got.length/100)|0;i<n;i++){const s=stars[i];x.globalAlpha=.4+.6*Math.abs(Math.sin(t*s.s*.6+s.p));x.fillStyle='#fff4e0';x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()}x.globalAlpha=1;
extra(got.length/100);const mx=W*.82,my=H*.2,mr=34*S+10,mg=x.createRadialGradient(mx,my,mr*.5,mx,my,mr*4);mg.addColorStop(0,'rgba(255,220,170,.5)');mg.addColorStop(1,'rgba(255,220,170,0)');x.fillStyle=mg;x.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);x.fillStyle='#ffe9c4';x.beginPath();x.arc(mx,my,mr,0,6.3);x.fill();x.fillStyle='#e9c79c';x.beginPath();x.arc(mx-mr*.3,my-mr*.2,mr*.18,0,6.3);x.arc(mx+mr*.25,my+mr*.3,mr*.12,0,6.3);x.fill();
for(const[k,col,off,amp]of[[1,'#3a1740',0,.06],[2,'#220d2c',2,.09]]){x.fillStyle=col;x.beginPath();x.moveTo(0,H);for(let px=0;px<=W;px+=12)x.lineTo(px,H-H*(.09-.03*(k-1))-Math.sin(px/(W*.18)+off)*H*amp*.5-Math.sin(px/(W*.07)+off*3)*H*.012);x.lineTo(W,H);x.fill()}}
function extra(pr){

if(pr>.3){for(let b=0;b<3;b++){x.strokeStyle=['rgba(255,150,170,','rgba(255,200,130,','rgba(190,140,255,'][b]+(.18*pr)+')';x.lineWidth=18*S;x.beginPath();for(let px=0;px<=W;px+=20){const py=H*(.3+b*.07)+Math.sin(px/(W*.15)+t*.4+b)*H*.04;px?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}}
if(pr>.4){const n=Math.floor(28*(pr-.4)/.6),cx=W*.28,cy=H*.3,sc=Math.min(W,H)*.011,pts=[];for(let i=0;i<=n;i++){const a=i/28*6.283;pts.push([cx+16*Math.pow(Math.sin(a),3)*sc,cy-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*sc])}x.strokeStyle='rgba(255,220,180,.5)';x.fillStyle='#fff';x.lineWidth=1;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();pts.forEach(p=>{x.beginPath();x.arc(p[0],p[1],2.4,0,6.3);x.fill()})}

function drawBow(){const b=bow();const a=aim!==null?aim:-Math.PI/2;x.save();x.translate(b.x,b.y);x.rotate(a);const L=48*S,pull=aim!==null?14*S:0;x.strokeStyle='#ffd9a0';x.lineWidth=4*S;x.shadowColor='#ffb070';x.shadowBlur=14;x.beginPath();x.moveTo(0,-L);x.quadraticCurveTo(26*S,0,0,L);x.stroke();x.lineWidth=1.3;x.strokeStyle='#fff';x.beginPath();x.moveTo(0,-L);x.lineTo(-pull,0);x.lineTo(0,L);x.stroke();if(aim!==null&&t-lastShot>.3){x.strokeStyle='#ffe4b0';x.lineWidth=2.5;x.beginPath();x.moveTo(-pull,0);x.lineTo(38*S,0);x.stroke()}x.restore();
if(aim!==null){let px=b.x,py=b.y,vx=Math.cos(aim)*SP(),vy=Math.sin(aim)*SP();x.fillStyle='#ffd9a0';for(let i=0;i<22;i++){for(let k=0;k<3;k++){px+=vx*.012;py+=vy*.012;vy+=G()*.012}x.globalAlpha=1-i/24;x.beginPath();x.arc(px,py,2.2,0,6.3);x.fill()}x.globalAlpha=1}}
function frame(n){const dt=Math.min((n-last)/1000||0,.05);last=n;t+=dt;sky();
if(t>nextGift){if(gifts.length<2&&!won)spawn();nextGift=t+3.5+Math.random()*3.5}
if(won&&Math.random()<dt*6)parts.push({x:Math.random()*W,y:H+20,vx:0,vy:-90-Math.random()*90,l:4,h:1,f:1,c:'#ff8fa3',z:10+Math.random()*14});
if(Math.random()<dt*.15)shoots.push({x:Math.random()*W,y:Math.random()*H*.3,l:1});
for(let i=shoots.length-1;i>=0;i--){const s=shoots[i];s.l-=dt*1.4;s.x-=dt*500;s.y+=dt*220;x.strokeStyle=`rgba(255,235,200,${Math.max(s.l,0)})`;x.lineWidth=2;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x+90,s.y-40);x.stroke();if(s.l<=0)shoots.splice(i,1)}
for(let i=gifts.length-1;i>=0;i--){const g=gifts[i];g.x+=g.vx*dt;g.y=g.y0+Math.sin(t*1.5+g.ph)*14*S;if(g.x<-80||g.x>W+80){gifts.splice(i,1);continue}gift(g)}
for(let i=arrows.length-1;i>=0;i--){const a=arrows[i];a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=G()*dt;a.trail.push([a.x,a.y]);if(a.trail.length>14)a.trail.shift();const an=Math.atan2(a.vy,a.vx);
x.lineWidth=2;for(let k=1;k<a.trail.length;k++){x.strokeStyle=`rgba(255,200,140,${k/a.trail.length*.6})`;x.beginPath();x.moveTo(...a.trail[k-1]);x.lineTo(...a.trail[k]);x.stroke()}
x.save();x.translate(a.x,a.y);x.rotate(an);x.strokeStyle='#fff4e0';x.lineWidth=2.5;x.shadowColor='#ffb070';x.shadowBlur=10;x.beginPath();x.moveTo(-26*S,0);x.lineTo(0,0);x.stroke();x.fillStyle='#ffd9a0';x.beginPath();x.moveTo(8*S,0);x.lineTo(-3*S,-4*S);x.lineTo(-3*S,4*S);x.fill();x.restore();
let done=a.y>H+50||a.x<-60||a.x>W+60;for(let j=gifts.length-1;j>=0&&!done;j--){const g=gifts[j];if(Math.hypot(a.x-g.x,a.y-g.y)<g.r*1.25){burst(g.x,g.y);gifts.splice(j,1);hit();done=true}}if(done)arrows.splice(i,1)}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt*.9;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.f?0:160)*dt;if(p.l<=0){parts.splice(i,1);continue}x.globalAlpha=Math.min(p.l,1);x.fillStyle=p.c;if(p.h){x.font=p.z*1.6+'px serif';x.fillText('♥',p.x,p.y)}else{x.beginPath();x.arc(p.x,p.y,p.z*.25,0,6.3);x.fill()}}x.globalAlpha=1;
drawBow();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
const grid=$('grid');for(let i=0;i<100;i++){const b=document.createElement('button');b.className='cell';b.id='c'+i;b.textContent=i+1;b.onclick=()=>{if(got.includes(i))$('read').innerHTML='<b>Nº '+(i+1)+'</b> · '+P[i]};grid.appendChild(b)}
function paint(){got.forEach(i=>{const b=$('c'+i);b.classList.add('got')});for(let i=0;i<100;i++)if(!got.includes(i))$('c'+i).textContent='?';else $('c'+i).textContent=i+1;$('cnt').textContent=got.length}
$('open').onclick=()=>{paint();$('album').classList.add('on')};$('close').onclick=()=>$('album').classList.remove('on');
$('cnt').textContent=got.length;
let won=false,wi=0;
function victory(){if(won)return;won=true;$('card').classList.remove('on');$('album').classList.remove('on');$('top').style.display=$('hint').style.display='none';const w=$('win');w.classList.add('show');void w.offsetWidth;w.classList.add('on');wshow(0)}
function wshow(i){wi=(i+100)%100;$('rg').value=wi+1;$('wn').textContent='RAZÓN Nº '+(wi+1)+' DE 100';$('wt').textContent=P[wi];const c=$('wc');c.classList.remove('f');void c.offsetWidth;c.classList.add('f')}
$('pv').onclick=()=>wshow(wi-1);$('nx').onclick=()=>wshow(wi+1);$('rg').oninput=e=>wshow(+e.target.value-1);
addEventListener('keydown',e=>{if(!won)return;if(e.key==='ArrowLeft')wshow(wi-1);if(e.key==='ArrowRight')wshow(wi+1)});
let tx=0;$('wc').addEventListener('touchstart',e=>tx=e.touches[0].clientX);$('wc').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)wshow(wi+(d<0?1:-1))});
if(got.length===100)victory();
</script>
</body>
</html>
